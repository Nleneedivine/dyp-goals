name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify marketing demo isolation
        run: node scripts/check-marketing-demo.mjs

      - name: Build production (demo disabled)
        run: npm run build

      - name: Build marketing demo artifact (never deploy)
        run: npm run build:marketing-demo
        env:
          VITE_ENABLE_MARKETING_DEMO: "true"
